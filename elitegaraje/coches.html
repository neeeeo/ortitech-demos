<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Coches de ocasión en stock · Elite Garaje (demo de OrtiTech)</title>
<meta name="description" content="Demo de propuesta preparada por OrtiTech para Elite Garaje. No es la web oficial del concesionario.">
<meta name="theme-color" content="#0d0e10">
<link rel="icon" href="img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css?v=4">
</head>
<body data-page="stock">
<div id="top"></div>

<main>
  <header class="page-head">
    <div class="wrap">
      <nav class="crumbs" aria-label="Migas"><a href="index.html">Inicio</a><span>/</span><span>Coches</span></nav>
      <h1>Coches de ocasión en stock</h1>
      <p class="lead">Todos revisados, con garantía y cambio de nombre incluidos. Filtra por marca, precio o tipo y encuentra el tuyo.</p>
    </div>
  </header>

  <div class="wrap stock">
    <aside class="filters" id="filters" aria-label="Filtros"></aside>
    <div>
      <div class="toolbar">
        <div class="n" id="n" aria-live="polite"></div>
        <div class="tools">
          <button class="btn ghost sm filt-btn" id="abrir-filtros" type="button">Filtros<span id="nf"></span></button>
          <select id="orden" aria-label="Ordenar">
            <option value="rec">Recomendados</option>
            <option value="precio-asc">Precio: de menor a mayor</option>
            <option value="precio-desc">Precio: de mayor a menor</option>
            <option value="km-asc">Menos kilómetros</option>
            <option value="anio-desc">Más nuevos</option>
          </select>
        </div>
      </div>
      <div class="grid" id="lista"></div>
    </div>
  </div>
</main>

<div id="bottom"></div>
<script src="js/coches.js?v=4"></script>
<script src="js/app.js?v=4"></script>
</body>
</html>
