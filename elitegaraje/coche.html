<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Coche · Elite Garaje (demo de OrtiTech)</title>
<meta name="description" content="Demo de propuesta preparada por OrtiTech para Elite Garaje. No es la web oficial del concesionario.">
<meta name="theme-color" content="#0d0e10">
<link rel="icon" href="img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css?v=5">
</head>
<body data-page="coche">
<div id="top"></div>

<main>
  <div class="wrap">
    <nav class="crumbs" aria-label="Migas" style="margin:22px 0 0;color:var(--muted)"><a href="index.html">Inicio</a><span>/</span><a href="coches.html">Coches</a><span>/</span><span id="crumb"></span></nav>
    <div class="detail">
      <div>
        <div class="gallery" id="gallery"></div>
        <div id="info" style="margin-top:18px"></div>
      </div>
      <aside class="buy" id="buy"></aside>
    </div>
  </div>

  <section style="padding-top:0">
    <div class="wrap">
      <div class="head"><div><span class="eyebrow">También te puede interesar</span><h2 class="title">Coches parecidos</h2></div><a class="btn ghost" href="coches.html">Ver todo el stock →</a></div>
      <div class="grid" id="parecidos"></div>
    </div>
  </section>
</main>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="m-title">
  <div class="panel">
    <button class="x" aria-label="Cerrar">×</button>
    <form class="demo-form" style="display:grid;gap:16px">
      <div><h2 id="m-title" style="font-size:24px">Me interesa este coche</h2><p class="muted" id="m-coche" style="margin-top:6px"></p></div>
      <div class="row2">
        <div class="field"><label for="m-nombre">Nombre</label><input id="m-nombre" name="nombre" required autocomplete="name"></div>
        <div class="field"><label for="m-tel">Teléfono</label><input id="m-tel" name="telefono" type="tel" required autocomplete="tel"></div>
      </div>
      <div class="field"><label for="m-email">Email</label><input id="m-email" name="email" type="email" autocomplete="email"></div>
      <div class="field"><label for="m-msg">¿Algo que quieras preguntar?</label><textarea id="m-msg" name="mensaje" placeholder="Por ejemplo: ¿puedo ir a verlo el sábado? ¿Aceptáis mi coche como parte del pago?"></textarea></div>
      <label class="check"><input type="checkbox" required> He leído y acepto la política de privacidad.</label>
      <button class="btn red block" type="submit">Enviar</button>
      <p class="note">Demo: este formulario no envía nada. En la web real, os llega al momento al email y al móvil.</p>
    </form>
    <div class="done"><div class="ok"><i data-i="check"></i></div><h3>¡Recibido!</h3><p class="muted">Te llamamos en breve para resolver tus dudas y darte cita.</p></div>
  </div>
</div>

<div id="bottom"></div>
<script src="js/coches.js?v=5"></script>
<script src="js/app.js?v=5"></script>
</body>
</html>
